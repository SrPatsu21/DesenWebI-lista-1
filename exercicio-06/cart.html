<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="checkout.html">Finalizar Compra</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Carrinho de Compras</h1>
        <div id="cart"></div>
        <h2 id="total"></h2>
        <button onclick="checkout()">Finalizar Compra</button>
    </main>

    <footer>
        <p>Loja de Informática &copy; 2024</p>
    </footer>

    <script>
        var value = 0;
        function updateCart() {
            const cart = JSON.parse(localStorage.getItem("cart")) || [];
            const cartContainer = document.getElementById("cart");
            value = 0;
            cart.forEach(product=>{
                value += (product.price*product.quantity);
            })
            cartContainer.innerHTML = cart.map(product => `
                <div class="cart-item">
                    <img src="${product.images[0]}" alt="${product.name}">
                    <p>${product.name}</p>
                    <p>Preço: R$ ${(product.price*product.quantity).toFixed(2)}</p>
                    <p>
                        <button onclick="changeQuantity(${product.id}, -1)">-</button>
                        <span>${product.quantity}</span>
                        <button onclick="changeQuantity(${product.id}, 1)">+</button>
                    </p>
                    <button onclick="removeFromCart(${product.id})">Remover do Carrinho</button>
                </div>
            `).join("");
            const total = document.getElementById("total");
            total.innerHTML = "total:" + value.toFixed(2);
        }

        function changeQuantity(productId, change) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            const product = cart.find(p => p.id === productId);
            if (product) {
                product.quantity += change;
                if (product.quantity <= 0) {
                    removeFromCart(productId);
                } else {
                    localStorage.setItem("cart", JSON.stringify(cart));
                    updateCart();
                }
            }
        }

        function removeFromCart(productId) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart = cart.filter(product => product.id !== productId);
            localStorage.setItem("cart", JSON.stringify(cart));
            alert("Produto removido do carrinho!");
            updateCart();
        }

        document.addEventListener("DOMContentLoaded", function() {
            const cart = JSON.parse(localStorage.getItem("cart")) || [];
            // Initialize quantity for each product if not set
            cart.forEach(product => {
                product.quantity = product.quantity || 1;
            });
            localStorage.setItem("cart", JSON.stringify(cart));
            updateCart();
        });

        function checkout() {
            if (confirm("Você deseja finalizar a compra?")) {
                window.location.href = "checkout.html";
            }
        }

    </script>
</body>
</html>
